[pytest]
DJANGO_SETTINGS_MODULE = tests.settings
python_files = test_*.py
testpaths = tests
addopts = -q
# Required for `tests.settings` (DJANGO_SETTINGS_MODULE, above) to import under the plain
# `pytest` console-script invocation CI uses. `python -m pytest` implicitly adds the CWD to
# sys.path and masks the need for this; plain `pytest` does not, and pytest-django resolves
# DJANGO_SETTINGS_MODULE in an early hook that a conftest.py-based sys.path fix does not
# reliably run before (confirmed empirically, not just in theory) — this ini option is pytest's
# own native mechanism (pytest >= 7) and does run early enough.
pythonpath = .
