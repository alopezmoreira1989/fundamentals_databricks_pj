name: CI

# Quality gate for the repo: the pure-Python pipeline suite and ruff lint. Runs on PRs to
# main and on pushes to the integration branches.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev_alm]

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline-tests:
    name: pipeline tests (fundamentals_pipeline + streamlit lib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies (installs fundamentals_pipeline via -e .)
        run: pip install -r requirements-dev.txt
      # Only the root suite; web/tests need Django settings and run in the web job. Streamlit
      # fixture-backed tests self-skip when the gitignored fixtures are absent.
      - name: Run pytest
        run: pytest tests -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install "ruff>=0.6"
      # Repo-wide: the NN__ Databricks notebook sources are now linted too (mechanical rules
      # fixed; cell-idiom rules ignored per-stage-dir in ruff.toml). See #167.
      - name: ruff check
        run: ruff check .
