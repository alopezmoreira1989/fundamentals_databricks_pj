name: CI

# Quality gate for the repo: the pure-Python pipeline suite and ruff lint. Runs on PRs to
# main and on pushes to the integration branches.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev_alm]

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline-tests:
    name: pipeline tests (fundamentals_pipeline + streamlit lib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies (installs fundamentals_pipeline via -e .)
        run: pip install -r requirements-dev.txt
      # Only the root suite — fundamentals_screener/tests runs in its own job below (it has its
      # own package/Django-settings needs, see the screener-tests job). Streamlit fixture-backed
      # tests self-skip when the gitignored fixtures are absent.
      - name: Run pytest
        run: pytest tests -q

  screener-tests:
    name: fundamentals_screener tests
    runs-on: ubuntu-latest
    # fundamentals_screener/tests was previously never run in CI at all — the pipeline-tests
    # job above only covers root-level tests/. Only tests/test_updates.py needs Django
    # settings/DB (tests/settings.py, in-memory SQLite); everything else in this suite still
    # runs with zero Django configuration, unaffected by this job existing.
    defaults:
      run:
        working-directory: fundamentals_screener
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install fundamentals_screener (+ test extras)
        run: pip install -e ".[test]"
      - name: Run pytest
        run: pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install "ruff>=0.6"
      # Repo-wide: the NN__ Databricks notebook sources are now linted too (mechanical rules
      # fixed; cell-idiom rules ignored per-stage-dir in ruff.toml). See #167.
      - name: ruff check
        run: ruff check .
